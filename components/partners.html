<section id="partners" class="section partners-section">

  <!-- Background decorations -->
  <div class="pt-grid"></div>
  <div class="pt-orb pt-orb-1"></div>
  <div class="pt-orb pt-orb-2"></div>
  <span class="pt-ring pt-ring-1"></span>
  <span class="pt-ring pt-ring-2"></span>
  <span class="pt-ring pt-ring-3"></span>
  <span class="pt-plus pt-plus-1">+</span>
  <span class="pt-plus pt-plus-2">+</span>
  <span class="pt-plus pt-plus-3">+</span>
  <span class="pt-plus pt-plus-4">+</span>

  <div class="container" style="position:relative;z-index:1;">

    <div class="section-header reveal">
      <h2 id="partners-heading"></h2>
      <p id="partners-subheading" class="section-sub"></p>
      <div class="section-divider"></div>
    </div>

    <!-- Slider wrapper -->
    <div class="pt-slider-wrap">
      <button class="pt-arrow pt-arrow-prev" id="pt-prev" aria-label="Previous">
        <i class="fas fa-chevron-left"></i>
      </button>
      <div class="pt-slider" id="pt-slider"></div>
      <button class="pt-arrow pt-arrow-next" id="pt-next" aria-label="Next">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>

    <!-- Mobile arrows below card -->
    <div class="pt-mobile-arrows">
      <button class="pt-arrow" id="pt-prev-mob" aria-label="Previous">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button class="pt-arrow" id="pt-next-mob" aria-label="Next">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>

    <!-- Dots -->
    <div class="pt-dots" id="pt-dots"></div>

  </div>
</section>
