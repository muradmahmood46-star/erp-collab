<section id="home" class="hero">
  <div class="hero-overlay"></div>

  <div class="hero-blob hero-blob-1"></div>
  <div class="hero-blob hero-blob-2"></div>
  <div class="hero-blob hero-blob-3"></div>

  <div class="hero-content">
    <div class="hero-inner">

      <!-- badge pill -->
      <div class="hero-badge reveal">
        <span class="hero-badge-dot"></span>
        <span id="hero-badge-text">Software &amp; AI Development Company</span>
      </div>

      <!-- animated underline tagline -->
      <div class="hero-tagline-wrap reveal">
        <p class="hero-tagline" id="hero-tagline"></p>
      </div>

      <!-- description -->
      <p class="hero-desc reveal" id="hero-desc"></p>

      <!-- CTA buttons -->
      <div class="hero-btns reveal" id="hero-btns"></div>

      <!-- stats row -->
      <div class="hero-stats reveal" id="hero-stats">
        <div class="hero-stat">
          <span class="hero-stat-num">50<span class="hero-stat-plus">+</span></span>
          <span class="hero-stat-label">Technologies</span>
        </div>
        <div class="hero-stat-divider"></div>
        <div class="hero-stat">
          <span class="hero-stat-num">100<span class="hero-stat-plus">%</span></span>
          <span class="hero-stat-label">Client Focused</span>
        </div>
        <div class="hero-stat-divider"></div>
        <div class="hero-stat">
          <span class="hero-stat-num">2023</span>
          <span class="hero-stat-label">Founded</span>
        </div>
      </div>

    </div>
  </div>

  <!-- scroll indicator -->
  <a href="#about" class="hero-scroll-indicator" aria-label="Scroll down">
    <span class="hero-scroll-mouse">
      <span class="hero-scroll-wheel"></span>
    </span>
  </a>
</section>
