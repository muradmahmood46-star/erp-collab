<section id="contact" class="section contact-section bg-light">
  <div class="container">
    <div class="section-header reveal">
      <h2 id="contact-heading"></h2>
      <p id="contact-subheading" class="section-sub"></p>
      <div class="section-divider"></div>
    </div>
    <div class="contact-grid">
      <div class="contact-info reveal" id="contact-info"></div>
      <div class="contact-form-wrap reveal">
        <form class="contact-form" id="contact-form" novalidate>
          <div id="form-fields"></div>
          <button type="submit" class="btn btn-primary btn-full" id="form-submit"></button>
        </form>
      </div>
    </div>
    <div class="map-wrap reveal">
      <a href="https://maps.app.goo.gl/2qYsFE3ZJgA5ofVV7" target="_blank" rel="noopener noreferrer" class="map-link-wrap" title="Open in Google Maps">
        <iframe id="contact-map" src="" width="100%" height="380" style="border:0;pointer-events:none;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="ErpCollab Location"></iframe>
        <div class="map-overlay"><i class="fas fa-map-marker-alt"></i> Open in Google Maps</div>
      </a>
    </div>
  </div>
</section>
